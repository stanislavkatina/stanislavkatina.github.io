<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic longitudinal mean profile</title>
<style>:root{--bg:#fff;--fg:#18232c;--muted:#5d6c76;--grid:#dce3e7;--a:#087f8c;--b:#7b5cc7;--review:#d89a00}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);font-family:Arial,sans-serif}body.dark{--bg:#071827;--fg:#eef6f8;--muted:#9fb3bf;--grid:#294252;--a:#43d8c9;--b:#c49cff;--review:#ffbd59}svg{display:block;width:100%;height:100%}.title{font-size:18px;font-weight:700;fill:var(--fg)}.subtitle,.note,.tick,.legend{fill:var(--muted)}.subtitle{font-size:13px}.note{font-size:11px}.tick,.legend{font-size:12px}.grid{stroke:var(--grid)}.zero{stroke:var(--muted);stroke-width:1.4}.axis{stroke:var(--fg)}.axis-title{fill:var(--fg);font-size:13px}.profile-a,.ci-a{stroke:var(--a)}.profile-b,.ci-b{stroke:var(--b)}.profile-a,.profile-b{fill:none;stroke-width:3}.ci-a,.ci-b{stroke-width:2}.mark-a{fill:var(--a)}.mark-b{fill:var(--b)}.review{fill:var(--review)}.tipbox{fill:var(--bg);stroke:var(--grid)}.tiphead{fill:var(--fg);font-weight:700;font-size:12px}</style></head>
<body><style>html,body{height:auto;overflow:visible}html{overflow:hidden}body{overflow-x:auto;overflow-y:hidden}svg{width:100%;height:auto;min-width:900px}</style><svg id="chart" viewBox="0 0 1050 610" role="img" aria-label="Synthetic repeated-measures visit-specific means with pointwise 95 percent confidence intervals"></svg><script src="synthetic-longitudinal-data.js?v=20261011-5"></script><script>
const {records,visits,groups}=window.syntheticLongitudinal,svg=document.querySelector('#chart'),NS='http://www.w3.org/2000/svg',X0=110,X1=950,Y0=110,Y1=450,ymin=-30,ymax=45,E=(t,a={},s='')=>{const e=document.createElementNS(NS,t);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(s)e.textContent=s;return e},x=i=>X0+(X1-X0)*i/(visits.length-1),y=v=>Y1-(Y1-Y0)*(v-ymin)/(ymax-ymin);
const stats=[0,1].map(group=>visits.map((_,visitIndex)=>{const a=records.filter(d=>d.group===group&&d.visitIndex===visitIndex).map(d=>d.value),mean=a.reduce((s,v)=>s+v,0)/a.length,sd=Math.sqrt(a.reduce((s,v)=>s+(v-mean)**2,0)/(a.length-1)),se=sd/Math.sqrt(a.length);return{group,visitIndex,n:a.length,mean,lo:mean-1.96*se,hi:mean+1.96*se,review:records.some(d=>d.group===group&&d.visitIndex===visitIndex&&d.review)}}));
function render(){svg.innerHTML='';svg.append(E('text',{x:55,y:34,class:'title'},'Synthetic repeated-measures data: Visit-specific means and pointwise 95% CIs'));svg.append(E('text',{x:55,y:55,class:'subtitle'},'The same stable subjects and observations are used in the coordinated patient-level distribution plot.'));for(let v=-30;v<=40;v+=10){svg.append(E('line',{x1:X0,x2:X1,y1:y(v),y2:y(v),class:v===0?'zero':'grid'}));svg.append(E('text',{x:X0-13,y:y(v)+4,'text-anchor':'end',class:'tick'},v))}visits.forEach((v,i)=>{svg.append(E('line',{x1:x(i),x2:x(i),y1:Y0,y2:Y1,class:'grid'}));svg.append(E('text',{x:x(i),y:Y1+22,'text-anchor':'middle',class:'tick'},v))});svg.append(E('line',{x1:X0,x2:X1,y1:Y1,y2:Y1,class:'axis'}));svg.append(E('line',{x1:X0,x2:X0,y1:Y0,y2:Y1,class:'axis'}));svg.append(E('text',{x:30,y:(Y0+Y1)/2,transform:`rotate(-90 30 ${(Y0+Y1)/2})`,'text-anchor':'middle',class:'axis-title'},'Mean change from baseline'));stats.forEach((a,g)=>{svg.append(E('path',{d:a.map((d,i)=>(i?'L':'M')+x(i)+','+y(d.mean)).join(''),class:`profile-${g?'b':'a'}`}));a.forEach(d=>{const xx=x(d.visitIndex),c=7;[[xx,xx,y(d.lo),y(d.hi)],[xx-c,xx+c,y(d.lo),y(d.lo)],[xx-c,xx+c,y(d.hi),y(d.hi)]].forEach(z=>svg.append(E('line',{x1:z[0],x2:z[1],y1:z[2],y2:z[3],class:`ci-${g?'b':'a'}`})));const m=g?E('circle',{cx:xx,cy:y(d.mean),r:5,class:'mark-b'}):E('rect',{x:xx-5,y:y(d.mean)-5,width:10,height:10,class:'mark-a'});m.dataset.g=g;m.dataset.v=d.visitIndex;m.onmouseenter=showTip;m.onmouseleave=clearTip;svg.append(m);if(d.review)svg.append(E('path',{d:`M${xx},${y(d.hi)-20}l7,7l-7,7l-7,-7Z`,class:'review'}))})});[[0,'Group A'],[1,'Group B']].forEach(([g,n],i)=>svg.append(E('text',{x:420+i*150,y:510,class:'legend'},n)));['Pointwise intervals use mean ± 1.96 standard errors at each visit; they are descriptive, not a longitudinal model.','Subjects retain stable identifiers across visits; monotone dropout reduces later-visit sample sizes.','The yellow diamond marks the summary containing the same synthetic review value shown in the distribution plot.'].forEach((n,i)=>svg.append(E('text',{x:80,y:548+i*16,class:'note'},n)))}
function clearTip(){svg.querySelectorAll('.hover').forEach(e=>e.remove())}function showTip(e){clearTip();const d=stats[+e.currentTarget.dataset.g][+e.currentTarget.dataset.v],bx=Math.min(x(d.visitIndex)+12,760),by=Math.max(90,y(d.mean)-94),g=E('g',{class:'hover'});g.append(E('rect',{x:bx,y:by,width:230,height:82,rx:7,class:'tipbox'}));g.append(E('text',{x:bx+10,y:by+20,class:'tiphead'},visits[d.visitIndex]));g.append(E('text',{x:bx+10,y:by+42,class:'note'},`${groups[d.group]} · n = ${d.n}`));g.append(E('text',{x:bx+10,y:by+64,class:'note'},`Mean ${d.mean.toFixed(1)} (95% CI ${d.lo.toFixed(1)}, ${d.hi.toFixed(1)})`));svg.append(g)}const dark=new URLSearchParams(location.search).get('theme')==='dark'||matchMedia('(prefers-color-scheme:dark)').matches;document.body.classList.toggle('dark',dark);render();
</script><style>.review{display:none}</style><script>function clarifyOutlierEffect(){[...svg.querySelectorAll('text.note')].find(node=>node.textContent.includes('yellow diamond'))?.replaceChildren('The wider Group A interval at Week 16 reflects one influential synthetic value; the individual value is intentionally not plotted here.')}clarifyOutlierEffect();addEventListener('message',event=>{if(event.data?.type==='portfolio-theme'){document.body.classList.toggle('dark',event.data.theme==='dark');render();clarifyOutlierEffect();}});</script></body></html>
