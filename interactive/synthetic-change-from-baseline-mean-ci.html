<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic mean profile with 95% CI</title>
<style>:root{--bg:#fff;--ink:#172030;--muted:#53647c;--grid:#d9e2ec;--a:#0072b2;--b:#d95f02;--tip:#fff;--line:#cbd5e1;--review:#ffc400}body.dark{--bg:#1d2935;--ink:#f2f6fa;--muted:#bdc9d5;--grid:#415264;--a:#59b8eb;--b:#ff9b45;--tip:#17222d;--line:#526578;--review:#ffd84a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.theme{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:8px 18px 0;color:var(--muted);font-size:12px;font-weight:700}.theme select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}.scroll{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:880px}svg text{font-family:inherit;fill:var(--ink)}.title{font-size:17px;font-weight:800}.grid{stroke:var(--grid);stroke-width:1}.zero{stroke:var(--muted);stroke-width:1.4}.axis{stroke:var(--ink);stroke-width:1}.tick{font-size:11px}.axis-title{font-size:13px;font-weight:800}.profile-a,.profile-b{fill:none;stroke-width:2.2;stroke-dasharray:8 7}.profile-a,.ci-a{stroke:var(--a)}.profile-b,.ci-b{stroke:var(--b)}.ci-a,.ci-b{stroke-width:2}.mark-a{fill:var(--a)}.mark-b{fill:var(--b)}.legend{font-size:12px}.note{fill:var(--muted);font-size:11px}.tipbox{fill:var(--tip);stroke:var(--line)}.tiphead{font-weight:800}.tip-a{fill:var(--a);font-weight:750}.tip-b{fill:var(--b);font-weight:750}.review{fill:var(--review);stroke:var(--ink);stroke-width:1.5}</style></head><body>

<script>addEventListener('load',()=>{const dodge=7,offset=()=>{const pa=svg.querySelector('path.profile-a'),pb=svg.querySelector('path.profile-b');if(pa)pa.setAttribute('transform',`translate(${-dodge} 0)`);if(pb)pb.setAttribute('transform',`translate(${dodge} 0)`);svg.querySelectorAll('line.ci-a').forEach(e=>{['x1','x2'].forEach(a=>e.setAttribute(a,Number(e.getAttribute(a))-dodge))});svg.querySelectorAll('line.ci-b').forEach(e=>{['x1','x2'].forEach(a=>e.setAttribute(a,Number(e.getAttribute(a))+dodge))});svg.querySelectorAll('[data-gi="0"]').forEach(e=>{const a=e.tagName==='circle'?'cx':'x';e.setAttribute(a,Number(e.getAttribute(a))-dodge)});svg.querySelectorAll('[data-gi="1"]').forEach(e=>{const a=e.tagName==='circle'?'cx':'x';e.setAttribute(a,Number(e.getAttribute(a))+dodge)})};new MutationObserver(offset).observe(svg,{childList:true});offset()})</script>

<script>const body=document.body,svg=document.querySelector('#chart'),NS='http://www.w3.org/2000/svg';let websiteDark=null;const visits=['Baseline','Week 4','Week 8','Week 12','Week 16','Week 24'],X0=110,X1=950,Y0=110,Y1=450,ymin=-25,ymax=30;const E=(tag,a={},txt='')=>{const e=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(txt!==''&&txt!==null)e.textContent=txt;return e},x=i=>X0+(X1-X0)*i/(visits.length-1),y=v=>Y1-(Y1-Y0)*(v-ymin)/(ymax-ymin);let seed=72819;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function normal(){return Math.sqrt(-2*Math.log(Math.max(rand(),1e-8)))*Math.cos(2*Math.PI*rand())}const raw=[];for(let vi=0;vi<visits.length;vi++)for(let gi=0;gi<2;gi++){const n=vi===0?52:48-vi,mu=vi===0?0:(gi===0?2.5*vi:-1.25*vi),sd=vi===0?.8:12+1.8*vi;for(let j=0;j<n;j++)raw.push({vi,gi,value:mu+sd*normal()})}raw.push({vi:4,gi:0,value:112,review:true});const stats=[0,1].map(gi=>visits.map((_,vi)=>{const a=raw.filter(d=>d.gi===gi&&d.vi===vi).map(d=>d.value),mean=a.reduce((s,v)=>s+v,0)/a.length,sd=Math.sqrt(a.reduce((s,v)=>s+(v-mean)**2,0)/(a.length-1)),se=sd/Math.sqrt(a.length);return{gi,vi,n:a.length,mean,lo:mean-1.96*se,hi:mean+1.96*se,review:a.some((_,i)=>false)||(gi===0&&vi===4)}}));function path(a){return a.map((d,i)=>(i?'L':'M')+x(i)+','+y(d.mean)).join('')}function render(){svg.innerHTML='';['Synthetic figure: Mean change from baseline (95% CI)','Coordinated summary of the patient-level distributions'].forEach((t,i)=>svg.append(E('text',{x:55,y:34+i*21,class:'title'},t)));for(let v=-20;v<=30;v+=10){svg.append(E('line',{x1:X0,x2:X1,y1:y(v),y2:y(v),class:v===0?'zero':'grid'}));svg.append(E('text',{x:X0-13,y:y(v)+4,'text-anchor':'end',class:'tick'},v))}visits.forEach((v,i)=>{svg.append(E('line',{x1:x(i),x2:x(i),y1:Y0,y2:Y1,class:'grid'}));svg.append(E('text',{x:x(i),y:Y1+22,'text-anchor':'middle',class:'tick'},v))});svg.append(E('line',{x1:X0,x2:X1,y1:Y1,y2:Y1,class:'axis'}));svg.append(E('line',{x1:X0,x2:X0,y1:Y0,y2:Y1,class:'axis'}));svg.append(E('text',{x:30,y:(Y0+Y1)/2,transform:`rotate(-90 30 ${(Y0+Y1)/2})`,'text-anchor':'middle',class:'axis-title'},'Mean (95% CI) change from baseline'));stats.forEach((a,gi)=>{svg.append(E('path',{d:path(a),class:`profile-${gi?'b':'a'}`}));a.forEach(d=>{const xx=x(d.vi),cap=7;svg.append(E('line',{x1:xx,x2:xx,y1:y(d.lo),y2:y(d.hi),class:`ci-${gi?'b':'a'}`}));svg.append(E('line',{x1:xx-cap,x2:xx+cap,y1:y(d.lo),y2:y(d.lo),class:`ci-${gi?'b':'a'}`}));svg.append(E('line',{x1:xx-cap,x2:xx+cap,y1:y(d.hi),y2:y(d.hi),class:`ci-${gi?'b':'a'}`}));const m=gi===0?E('rect',{x:xx-5,y:y(d.mean)-5,width:10,height:10,class:'mark-a'}):E('circle',{cx:xx,cy:y(d.mean),r:5,class:'mark-b'});m.dataset.gi=gi;m.dataset.vi=d.vi;m.addEventListener('mouseenter',showTip);m.addEventListener('mouseleave',clearTip);svg.append(m);if(d.review){const yy=y(d.hi)-15;svg.append(E('path',{d:`M${xx},${yy-6}L${xx+6},${yy}L${xx},${yy+6}L${xx-6},${yy}Z`,class:'review'}))}})});legend();notes()}function legend(){const yy=505;svg.append(E('line',{x1:355,x2:385,y1:yy,y2:yy,class:'profile-a'}));svg.append(E('rect',{x:366,y:yy-5,width:10,height:10,class:'mark-a'}));svg.append(E('text',{x:394,y:yy+4,class:'legend'},'Group A'));svg.append(E('line',{x1:520,x2:550,y1:yy,y2:yy,class:'profile-b'}));svg.append(E('circle',{cx:535,cy:yy,r:5,class:'mark-b'}));svg.append(E('text',{x:559,y:yy+4,class:'legend'},'Group B'))}function notes(){['Means and confidence intervals summarize the same simulated values shown in the patient-level violin plot.','The yellow diamond identifies the visit whose Group A summary includes the synthetic review value.','Hover over a mean marker for the estimate, 95% CI and number of simulated observations.'].forEach((n,i)=>svg.append(E('text',{x:80,y:548+i*16,class:'note'},n)))}function clearTip(){svg.querySelectorAll('.hover').forEach(e=>e.remove())}function showTip(e){clearTip();const gi=+e.currentTarget.dataset.gi,vi=+e.currentTarget.dataset.vi,d=stats[gi][vi],bx=Math.min(x(vi)+12,760),by=Math.max(100,y(d.mean)-94),g=E('g',{class:'hover','pointer-events':'none'});g.append(E('rect',{x:bx,y:by,width:205,height:82,rx:7,class:'tipbox'}));g.append(E('text',{x:bx+10,y:by+20,class:'tiphead'},visits[vi]));g.append(E('text',{x:bx+10,y:by+42,class:gi?'tip-b':'tip-a'},`Group ${gi?'B':'A'} · n = ${d.n}`));g.append(E('text',{x:bx+10,y:by+64,class:'note'},`Mean ${d.mean.toFixed(1)} (95% CI ${d.lo.toFixed(1)}, ${d.hi.toFixed(1)})`));svg.append(g)}function inheritedDark(){if(websiteDark!==null)return websiteDark;return matchMedia('(prefers-color-scheme:dark)').matches}function setTheme(){const v=document.querySelector('#theme').value;body.classList.toggle('dark',v==='dark'||(v==='auto'&&inheritedDark()));render()}const requested=new URLSearchParams(location.search).get('theme');if(['light','dark'].includes(requested))document.querySelector('#theme').value=requested;document.querySelector('#theme').addEventListener('change',setTheme);addEventListener('message',e=>{if(e.data?.type==='portfolio-theme'){websiteDark=e.data.theme==='dark';if(document.querySelector('#theme').value==='auto')setTheme()}});setTheme();</script></body></html>
