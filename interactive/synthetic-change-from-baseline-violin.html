<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic change-from-baseline distributions</title>
<style>:root{--bg:#fff;--ink:#172030;--muted:#53647c;--grid:#d9e2ec;--a:#0072b2;--b:#d95f02;--ref:#64748b;--tip:#fff;--line:#cbd5e1;--review:#ffc400}body.dark{--bg:#1d2935;--ink:#f2f6fa;--muted:#bdc9d5;--grid:#415264;--a:#59b8eb;--b:#ff9b45;--ref:#a9b9c8;--tip:#17222d;--line:#526578;--review:#ffd84a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.theme{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:8px 18px 0;color:var(--muted);font-size:12px;font-weight:700}.theme select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}.scroll{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:880px}svg text{font-family:inherit;fill:var(--ink)}.title{font-size:17px;font-weight:800}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--ink);stroke-width:1}.tick{font-size:11px}.axis-title{font-size:13px;font-weight:800}.violin-a{fill:var(--a);fill-opacity:.28;stroke:var(--a);stroke-width:1.25}.violin-b{fill:var(--b);fill-opacity:.27;stroke:var(--b);stroke-width:1.25}.point-a{fill:var(--a);opacity:.66}.point-b{fill:var(--b);opacity:.66}.median{stroke:var(--ink);stroke-width:2.2}.quartile{stroke:var(--ink);stroke-width:1.2}.reference{stroke:var(--ref);stroke-width:2.5;stroke-dasharray:8 7}.legend{font-size:12px}.note{fill:var(--muted);font-size:11px}.tipbox{fill:var(--tip);stroke:var(--line)}.tiphead{font-weight:800}.tip-a{fill:var(--a);font-weight:750}.tip-b{fill:var(--b);font-weight:750}.review{fill:var(--review);stroke:var(--ink);stroke-width:2}</style></head><body>
<script>addEventListener('load',()=>{const extreme=data.find(d=>d.review);extreme.value=320;const positionReview=()=>{const marker=document.querySelector('.review');if(!marker)return;const xx=x(extreme.vi)-18,yy=y(112);marker.setAttribute('d',`M${xx},${yy-8}L${xx+8},${yy}L${xx},${yy+8}L${xx-8},${yy}Z`);marker.dataset.value=extreme.value.toFixed(1)};new MutationObserver(positionReview).observe(svg,{childList:true});setTheme();positionReview()})</script>

<script>const body=document.body,svg=document.querySelector('#chart'),NS='http://www.w3.org/2000/svg';let websiteDark=null;const visits=['Baseline','Week 4','Week 8','Week 12','Week 16','Week 24'],X0=105,X1=955,Y0=110,Y1=485,ymin=-70,ymax=130;const E=(tag,a={},txt='')=>{const e=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(txt!==''&&txt!==null)e.textContent=txt;return e},x=i=>X0+(X1-X0)*(i+.5)/visits.length,y=v=>Y1-(Y1-Y0)*(v-ymin)/(ymax-ymin);let seed=72819;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function normal(){return Math.sqrt(-2*Math.log(Math.max(rand(),1e-8)))*Math.cos(2*Math.PI*rand())}const data=[];for(let vi=0;vi<visits.length;vi++)for(let gi=0;gi<2;gi++){const n=vi===0?52:48-vi,mu=vi===0?0:(gi===0?2.5*vi:-1.25*vi),sd=vi===0?.8:12+1.8*vi;for(let j=0;j<n;j++)data.push({vi,gi,id:`S-${String(gi*100+vi*50+j+1).padStart(3,'0')}`,value:mu+sd*normal(),review:false})}data.push({vi:4,gi:0,id:'S-914',value:112,review:true});const groupName=['Group A','Group B'];function values(vi,gi){return data.filter(d=>d.vi===vi&&d.gi===gi&&!d.review).map(d=>d.value).sort((a,b)=>a-b)}function quant(a,p){const z=(a.length-1)*p,i=Math.floor(z),f=z-i;return a[i]*(1-f)+(a[i+1]??a[i])*f}function violinPath(a,cx){const h=Math.max(2.5,1.06*Math.sqrt(a.reduce((s,v)=>s+(v-a.reduce((q,z)=>q+z,0)/a.length)**2,0)/(a.length-1))*Math.pow(a.length,-.2)),lo=Math.max(ymin,a[0]-2.4*h),hi=Math.min(ymax,a.at(-1)+2.4*h),grid=Array.from({length:61},(_,i)=>lo+i*(hi-lo)/60),dens=grid.map(v=>a.reduce((s,q)=>s+Math.exp(-.5*((v-q)/h)**2),0)/a.length),mx=Math.max(...dens),w=28;let d='';grid.forEach((v,i)=>d+=(i?'L':'M')+(cx-w*dens[i]/mx)+','+y(v));for(let i=grid.length-1;i>=0;i--)d+='L'+(cx+w*dens[i]/mx)+','+y(grid[i]);return d+'Z'}function render(){svg.innerHTML='';['Synthetic figure: Patient-level change from baseline','Distribution and individual values by visit and group'].forEach((t,i)=>svg.append(E('text',{x:55,y:34+i*21,class:'title'},t)));for(let v=-50;v<=100;v+=25){svg.append(E('line',{x1:X0,x2:X1,y1:y(v),y2:y(v),class:'grid'}));svg.append(E('text',{x:X0-12,y:y(v)+4,'text-anchor':'end',class:'tick'},v))}visits.forEach((v,i)=>{svg.append(E('line',{x1:x(i),x2:x(i),y1:Y0,y2:Y1,class:'grid'}));svg.append(E('text',{x:x(i),y:Y1+22,'text-anchor':'middle',class:'tick'},v))});svg.append(E('line',{x1:X0,x2:X1,y1:Y1,y2:Y1,class:'axis'}));svg.append(E('line',{x1:X0,x2:X0,y1:Y0,y2:Y1,class:'axis'}));svg.append(E('text',{x:28,y:(Y0+Y1)/2,transform:`rotate(-90 28 ${(Y0+Y1)/2})`,'text-anchor':'middle',class:'axis-title'},'Change from baseline'));[-55,55].forEach(v=>svg.append(E('line',{x1:X0,x2:X1,y1:y(v),y2:y(v),class:'reference'})));visits.forEach((_,vi)=>[0,1].forEach(gi=>{const a=values(vi,gi),cx=x(vi)+(gi?18:-18);svg.append(E('path',{d:violinPath(a,cx),class:`violin-${gi?'b':'a'}`}));const q1=quant(a,.25),md=quant(a,.5),q3=quant(a,.75);svg.append(E('line',{x1:cx,x2:cx,y1:y(q1),y2:y(q3),class:'quartile'}));svg.append(E('line',{x1:cx-8,x2:cx+8,y1:y(md),y2:y(md),class:'median'}))}));data.forEach(d=>{const cx=x(d.vi)+(d.gi?18:-18),j=(rand()-.5)*24;if(!d.review){const c=E('circle',{cx:cx+j,cy:y(Math.max(ymin,Math.min(ymax,d.value))),r:2.1,class:`point-${d.gi?'b':'a'}`});c.dataset.id=d.id;c.dataset.group=groupName[d.gi];c.dataset.visit=visits[d.vi];c.dataset.value=d.value.toFixed(1);c.addEventListener('mouseenter',showTip);c.addEventListener('mouseleave',clearTip);svg.append(c)}});const r=data.find(d=>d.review),rx=x(r.vi)-18,ry=y(r.value),diamond=E('path',{d:`M${rx},${ry-8}L${rx+8},${ry}L${rx},${ry+8}L${rx-8},${ry}Z`,class:'review'});diamond.dataset.id=r.id;diamond.dataset.group='Group A';diamond.dataset.visit=visits[r.vi];diamond.dataset.value=r.value.toFixed(1);diamond.addEventListener('mouseenter',showTip);diamond.addEventListener('mouseleave',clearTip);svg.append(diamond);legend();notes()}function legend(){const yy=542;[[0,'Group A'],[1,'Group B']].forEach(([g,n],i)=>{const xx=390+i*150;svg.append(E('rect',{x:xx,y:yy-10,width:13,height:13,class:`violin-${g?'b':'a'}`}));svg.append(E('text',{x:xx+23,y:yy+1,class:'legend'},n))})}function notes(){['All visits, subject identifiers and values are simulated.','Violin shapes show patient-level distributions; dark bars show medians and vertical lines show interquartile ranges.','Yellow diamond identifies a synthetic review value. Hover over individual values for subject, group, visit and change.','Horizontal dashed reference lines show illustrative review limits.'].forEach((n,i)=>svg.append(E('text',{x:80,y:580+i*16,class:'note'},n)))}function clearTip(){svg.querySelectorAll('.hover').forEach(e=>e.remove())}function showTip(e){clearTip();const d=e.currentTarget.dataset,bx=Math.min(Number(e.currentTarget.getAttribute('cx')||x(4))+14,790),by=Math.max(105,Number(e.currentTarget.getAttribute('cy')||y(112))-78),g=E('g',{class:'hover','pointer-events':'none'});g.append(E('rect',{x:bx,y:by,width:180,height:72,rx:7,class:'tipbox'}));g.append(E('text',{x:bx+10,y:by+20,class:'tiphead'},d.id));g.append(E('text',{x:bx+10,y:by+41,class:d.group==='Group A'?'tip-a':'tip-b'},`${d.group} · ${d.visit}`));g.append(E('text',{x:bx+10,y:by+61,class:'note'},`Change from baseline: ${d.value}`));svg.append(g)}function inheritedDark(){if(websiteDark!==null)return websiteDark;return matchMedia('(prefers-color-scheme:dark)').matches}function setTheme(){const v=document.querySelector('#theme').value;body.classList.toggle('dark',v==='dark'||(v==='auto'&&inheritedDark()));seed=72819;render()}const requested=new URLSearchParams(location.search).get('theme');if(['light','dark'].includes(requested))document.querySelector('#theme').value=requested;document.querySelector('#theme').addEventListener('change',setTheme);addEventListener('message',e=>{if(e.data?.type==='portfolio-theme'){websiteDark=e.data.theme==='dark';if(document.querySelector('#theme').value==='auto')setTheme()}});setTheme();</script></body></html>
