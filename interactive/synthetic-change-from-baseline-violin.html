<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic repeated-measures distributions</title>
<style>:root{--bg:#fff;--fg:#18232c;--muted:#5d6c76;--grid:#dce3e7;--a:#087f8c;--b:#7b5cc7;--review:#d89a00}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);font-family:Arial,sans-serif}body.dark{--bg:#071827;--fg:#eef6f8;--muted:#9fb3bf;--grid:#294252;--a:#43d8c9;--b:#c49cff;--review:#ffbd59}svg{display:block;width:100%;height:100%}.title{font-size:18px;font-weight:700;fill:var(--fg)}.subtitle,.note,.tick{fill:var(--muted)}.subtitle{font-size:13px}.note{font-size:11px}.tick{font-size:12px}.grid{stroke:var(--grid)}.axis{stroke:var(--fg)}.zero{stroke:var(--muted);stroke-width:1.4}.axis-title{fill:var(--fg);font-size:13px}.violin-a{fill:var(--a);fill-opacity:.25;stroke:var(--a)}.violin-b{fill:var(--b);fill-opacity:.25;stroke:var(--b)}.point-a{fill:var(--a)}.point-b{fill:var(--b)}.quartile,.median{stroke:var(--fg);stroke-width:2}.review{fill:var(--review)}.tipbox{fill:var(--bg);stroke:var(--grid)}.tiphead{fill:var(--fg);font-size:12px;font-weight:700}</style></head>
<body><style>html,body{height:auto;overflow:visible}html{overflow:hidden}body{overflow-x:auto;overflow-y:hidden}svg{width:100%;height:auto;min-width:760px}</style><svg id="chart" viewBox="0 0 1050 610" role="img" aria-label="Synthetic patient-level repeated-measures change-from-baseline distributions"></svg><script src="synthetic-longitudinal-data.js?v=20261011-5"></script><script>
const {records,visits,groups}=window.syntheticLongitudinal,svg=document.querySelector('#chart'),NS='http://www.w3.org/2000/svg',X0=105,X1=955,Y0=110,Y1=465,ymin=-70,ymax=190,E=(t,a={},s='')=>{const e=document.createElementNS(NS,t);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(s)e.textContent=s;return e},x=i=>X0+(X1-X0)*(i+.5)/visits.length,y=v=>Y1-(Y1-Y0)*(v-ymin)/(ymax-ymin),values=(vi,g)=>records.filter(d=>d.visitIndex===vi&&d.group===g).map(d=>d.value).sort((a,b)=>a-b),q=(a,p)=>{const z=(a.length-1)*p,i=Math.floor(z),f=z-i;return a[i]*(1-f)+(a[i+1]??a[i])*f};
function path(a,cx){const m=a.reduce((s,v)=>s+v,0)/a.length,h=Math.max(2.5,1.06*Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))*Math.pow(a.length,-.2)),lo=Math.max(ymin,a[0]-2.4*h),hi=Math.min(ymax,a.at(-1)+2.4*h),g=Array.from({length:61},(_,i)=>lo+i*(hi-lo)/60),d=g.map(v=>a.reduce((s,w)=>s+Math.exp(-.5*((v-w)/h)**2),0)/a.length),mx=Math.max(...d),w=28;let p='';g.forEach((v,i)=>p+=(i?'L':'M')+(cx-w*d[i]/mx)+','+y(v));for(let i=g.length-1;i>=0;i--)p+='L'+(cx+w*d[i]/mx)+','+y(g[i]);return p+'Z'}function jitter(id,vi){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return((h+vi*17)%101/100-.5)*22}
function render(){svg.innerHTML='';svg.append(E('text',{x:55,y:34,class:'title'},'Synthetic repeated-measures data: Patient-level change from baseline'));svg.append(E('text',{x:55,y:55,class:'subtitle'},'Stable subject identifiers connect observations across visits; later sample sizes reflect monotone dropout.'));for(let v=-60;v<=60;v+=20){svg.append(E('line',{x1:X0,x2:X1,y1:y(v),y2:y(v),class:v===0?'zero':'grid'}));svg.append(E('text',{x:X0-12,y:y(v)+4,'text-anchor':'end',class:'tick'},v))}visits.forEach((v,i)=>{svg.append(E('line',{x1:x(i),x2:x(i),y1:Y0,y2:Y1,class:'grid'}));svg.append(E('text',{x:x(i),y:Y1+22,'text-anchor':'middle',class:'tick'},v))});svg.append(E('line',{x1:X0,x2:X1,y1:Y1,y2:Y1,class:'axis'}));svg.append(E('line',{x1:X0,x2:X0,y1:Y0,y2:Y1,class:'axis'}));visits.forEach((_,vi)=>[0,1].forEach(g=>{const a=values(vi,g),cx=x(vi)+(g?18:-18);svg.append(E('path',{d:path(a,cx),class:`violin-${g?'b':'a'}`}));svg.append(E('line',{x1:cx,x2:cx,y1:y(q(a,.25)),y2:y(q(a,.75)),class:'quartile'}));svg.append(E('line',{x1:cx-8,x2:cx+8,y1:y(q(a,.5)),y2:y(q(a,.5)),class:'median'}))}));records.forEach(d=>{const cx=x(d.visitIndex)+(d.group?18:-18)+jitter(d.id,d.visitIndex),cy=y(d.value),p=d.review?E('path',{d:`M${cx},${cy-8}l8,8l-8,8l-8,-8Z`,class:'review'}):E('circle',{cx,cy,r:2.1,class:`point-${d.group?'b':'a'}`});Object.assign(p.dataset,{id:d.id,group:groups[d.group],visit:d.visit,value:d.value.toFixed(1)});p.onmouseenter=tip;p.onmouseleave=clear;svg.append(p)});['All identifiers and values are simulated. The same records feed the coordinated mean-and-CI display.','Violin shapes show visit-specific distributions; dark bars show medians and vertical lines show interquartile ranges.','The yellow diamond marks one synthetic review value. Hover for subject, group, visit and change.'].forEach((n,i)=>svg.append(E('text',{x:80,y:535+i*16,class:'note'},n)))}function clear(){svg.querySelectorAll('.hover').forEach(e=>e.remove())}function tip(e){clear();const d=e.currentTarget.dataset,g=E('g',{class:'hover'});g.append(E('rect',{x:780,y:78,width:205,height:76,rx:7,class:'tipbox'}));g.append(E('text',{x:790,y:99,class:'tiphead'},d.id));g.append(E('text',{x:790,y:121,class:'note'},`${d.group} · ${d.visit}`));g.append(E('text',{x:790,y:141,class:'note'},`Change from baseline: ${d.value}`));svg.append(g)}const dark=new URLSearchParams(location.search).get('theme')==='dark'||matchMedia('(prefers-color-scheme:dark)').matches;document.body.classList.toggle('dark',dark);render();
</script><script>addEventListener('message',event=>{if(event.data?.type==='portfolio-theme'){document.body.classList.toggle('dark',event.data.theme==='dark');render();}});</script></body></html>
