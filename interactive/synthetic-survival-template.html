<style>:root{--bg:#fff;--ink:#172030;--muted:#53647c;--grid:#d9e2ec;--a:#0072b2;--a-lite:#56a9d5;--b:#d95f02;--b-lite:#efa56e;--tip:#fff;--line:#cbd5e1}body.dark{--bg:#1d2935;--ink:#f2f6fa;--muted:#bdc9d5;--grid:#415264;--a:#59b8eb;--a-lite:#9bd6f5;--b:#ff9b45;--b-lite:#ffc58e;--tip:#17222d;--line:#526578}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.theme{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:8px 18px 0;color:var(--muted);font-size:12px;font-weight:700}.theme select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}.scroll{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:900px}svg text{font-family:inherit;fill:var(--ink)}.title{font-size:17px;font-weight:800}.axis{stroke:var(--ink);stroke-width:1}.grid{stroke:var(--grid);stroke-width:1}.tick{font-size:11px;fill:var(--ink)}.axis-title{font-size:13px;font-weight:750}.band-a{fill:var(--a);opacity:.16}.band-b{fill:var(--b);opacity:.14}.curve-a{fill:none;stroke:var(--a);stroke-width:2.5}.curve-b{fill:none;stroke:var(--b);stroke-width:2.5}.failure-a{fill:var(--a)}.failure-b{fill:var(--b)}.censor{fill:none;stroke-width:1.7}.censor-a{stroke:var(--a-lite)}.censor-b{stroke:var(--b-lite)}.label-a,.risk-a{fill:var(--a);font-weight:800}.label-b,.risk-b{fill:var(--b);font-weight:800}.note{fill:var(--muted);font-size:11px}.hoverline{stroke:var(--muted);stroke-dasharray:4 4}.tipbox{fill:var(--tip);stroke:var(--line)}.tiptitle{font-weight:800}.tip-a{fill:var(--a);font-weight:750}.tip-b{fill:var(--b);font-weight:750}</style></head><body>

<script>const body=document.body,svg=document.querySelector('#chart'),NS='http://www.w3.org/2000/svg';let websiteDark=null;const A={id:'a',name:'Group A',t:[0,5,10,18,25,27,30,36,40,45,48,55,60,70,78,88,96,110,125,132,136,140,150],s:[1,.986,.976,.963,.948,.928,.906,.882,.861,.846,.824,.803,.789,.772,.754,.735,.719,.706,.692,.671,.653,.646,.646],lo:[1,.958,.943,.924,.901,.877,.851,.823,.797,.779,.755,.731,.714,.695,.675,.652,.632,.613,.585,.558,.534,.521,.521],hi:[1,.996,.991,.983,.972,.958,.944,.925,.909,.896,.879,.861,.849,.837,.823,.807,.794,.784,.775,.762,.748,.741,.741],fail:[5,10,18,25,27,30,36,40,45,48,55,60,70,78,88,96,110,125,132,136,140],cens:[9,24,34,52,66,91,133,135,137,139,150],risk:[120,112,101,88,76,64,1],cum:[0,3,6,10,14,17,62]};const B={id:'b',name:'Group B',t:[0,4,9,16,24,26,28,34,39,43,47,52,58,66,74,84,90,98,108,120,135,140,150],s:[1,.979,.963,.945,.929,.901,.884,.861,.842,.821,.794,.776,.754,.736,.718,.692,.667,.635,.619,.598,.589,.584,.584],lo:[1,.947,.925,.902,.879,.848,.827,.801,.780,.755,.726,.706,.683,.662,.641,.612,.584,.547,.529,.503,.486,.478,.478],hi:[1,.992,.984,.972,.960,.940,.926,.910,.895,.879,.857,.843,.826,.810,.793,.775,.752,.727,.714,.697,.688,.682,.682],fail:[4,9,16,24,26,28,34,39,43,47,52,58,66,74,84,90,98,108,120,135,140],cens:[13,23,31,50,72,92,134,136,138,139,150],risk:[118,108,95,79,66,52,1],cum:[0,5,8,12,17,22,65]};const groups=[A,B],ticks=[0,25,50,75,100,125,150],X0=150,X1=880,Y0=120,Y1=425;const E=(tag,a={},txt='')=>{const e=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(txt!==''&&txt!==null&&txt!==undefined)e.textContent=txt;return e},x=t=>X0+(X1-X0)*t/150,y=s=>Y1-(Y1-Y0)*s;function val(g,t,key='s'){let i=0;while(i+1<g.t.length&&g.t[i+1]<=t)i++;return g[key][i]}function step(g,key){let d=`M${x(g.t[0])},${y(g[key][0])}`;for(let i=1;i<g.t.length;i++)d+=`H${x(g.t[i])}V${y(g[key][i])}`;return d+`H${x(150)}`}function band(g){let d=`M${x(0)},${y(g.hi[0])}`;for(let i=1;i<g.t.length;i++)d+=`H${x(g.t[i])}V${y(g.hi[i])}`;d+=`H${x(150)}L${x(150)},${y(g.lo.at(-1))}`;for(let i=g.t.length-1;i>0;i--)d+=`H${x(g.t[i])}V${y(g.lo[i-1])}`;return d+`H${x(0)}Z`}function render(){svg.innerHTML='';const title=['Synthetic figure: Survival probability plot of time to first occurrence','of an illustrative composite event [synthetic analysis population]','[Survival probability; with risk/censoring table; with 95% CI]'];title.forEach((z,i)=>svg.append(E('text',{x:62,y:38+i*20,class:'title'},z)));for(let q=0;q<=5;q++){const v=q/5,yy=y(v);svg.append(E('line',{x1:X0,x2:X1,y1:yy,y2:yy,class:'grid'}));svg.append(E('text',{x:X0-14,y:yy+4,'text-anchor':'end',class:'tick'},v.toFixed(q===5?0:1)))}ticks.forEach(t=>{svg.append(E('line',{x1:x(t),x2:x(t),y1:Y0,y2:Y1,class:'grid'}));svg.append(E('text',{x:x(t),y:Y1+14,'text-anchor':'middle',class:'tick'},t))});svg.append(E('line',{x1:X0,x2:X1,y1:Y1,y2:Y1,class:'axis'}));svg.append(E('line',{x1:X0,x2:X0,y1:Y0,y2:Y1,class:'axis'}));svg.append(E('text',{x:(X0+X1)/2,y:Y1+48,'text-anchor':'middle',class:'axis-title'},'Time since origin (units)'));svg.append(E('text',{x:102,y:(Y0+Y1)/2,transform:`rotate(-90 102 ${(Y0+Y1)/2})`,'text-anchor':'middle',class:'axis-title'},'Survival probability'));groups.forEach(g=>svg.append(E('path',{d:band(g),class:`band-${g.id}`})));groups.forEach(g=>svg.append(E('path',{d:step(g,'s'),class:`curve-${g.id}`})));groups.forEach(g=>g.fail.forEach(t=>svg.append(E('circle',{cx:x(t),cy:y(val(g,t)),r:2.4,class:`failure-${g.id}`}))));groups.forEach(g=>g.cens.forEach(t=>{const xx=x(t),yy=y(val(g,t));svg.append(E('path',{d:`M${xx-4},${yy}H${xx+4}M${xx},${yy-4}V${yy+4}`,class:`censor censor-${g.id}`}))}));svg.append(E('line',{x1:x(150),x2:920,y1:y(val(A,150)),y2:y(val(A,150)),class:'curve-a'}));svg.append(E('text',{x:925,y:y(val(A,150))+4,class:'label-a'},'Group A'));svg.append(E('line',{x1:x(150),x2:920,y1:y(val(B,150)),y2:y(val(B,150)),class:'curve-b'}));svg.append(E('text',{x:925,y:y(val(B,150))+4,class:'label-b'},'Group B'));drawRisk();const hit=E('rect',{x:X0,y:Y0,width:X1-X0,height:Y1-Y0,fill:'transparent',style:'cursor:crosshair'});hit.addEventListener('mousemove',hover);hit.addEventListener('mouseleave',()=>svg.querySelectorAll('.hover').forEach(e=>e.remove()));svg.append(hit)}function drawRisk(){groups.forEach((g,gi)=>ticks.forEach((t,i)=>svg.append(E('text',{x:x(t),y:497+gi*25,'text-anchor':'middle',class:`risk-${g.id}`},`${g.risk[i]} (${g.cum[i]})`))));svg.append(E('text',{x:138,y:497,'text-anchor':'end',class:'risk-a'},'Group A'));svg.append(E('text',{x:138,y:522,'text-anchor':'end',class:'risk-b'},'Group B'));const notes=['All event times, censoring times, estimates, confidence intervals and counts are simulated.','Visualized measure: survival probability S(t).','Risk table: number at risk (cumulative number censored), shown at aligned 25-unit intervals.','Confidence interval: synthetic stepwise 95% CI.'];notes.forEach((n,i)=>svg.append(E('text',{x:138,y:574+i*16,class:'note'},n)))}const ev=[...new Set(groups.flatMap(g=>g.fail.concat(g.cens)))].sort((a,b)=>a-b);function hover(e){svg.querySelectorAll('.hover').forEach(z=>z.remove());const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const loc=p.matrixTransform(svg.getScreenCTM().inverse()),raw=(loc.x-X0)*150/(X1-X0),t=ev.reduce((a,b)=>Math.abs(b-raw)<Math.abs(a-raw)?b:a),L=E('g',{class:'hover'});L.append(E('line',{x1:x(t),x2:x(t),y1:Y0,y2:Y1,class:'hoverline'}));groups.forEach(g=>L.append(E('circle',{cx:x(t),cy:y(val(g,t)),r:5,fill:`var(--${g.id})`,stroke:'var(--bg)','stroke-width':2})));const bx=Math.min(x(t)+12,740),by=135;L.append(E('rect',{x:bx,y:by,width:210,height:104,rx:7,class:'tipbox'}));L.append(E('text',{x:bx+10,y:by+20,class:'tiptitle'},`Time ${t}`));groups.forEach((g,i)=>{const type=g.fail.includes(t)?'failure':g.cens.includes(t)?'censoring':'no event';L.append(E('text',{x:bx+10,y:by+47+i*27,class:`tip-${g.id}`},`${g.name}: S(t) ${val(g,t).toFixed(3)}`));L.append(E('text',{x:bx+137,y:by+47+i*27,class:'note'},type))});svg.append(L)}function inheritedDark(){if(websiteDark!==null)return websiteDark;return matchMedia('(prefers-color-scheme:dark)').matches}function setTheme(){const v=document.querySelector('#theme').value;body.classList.toggle('dark',v==='dark'||(v==='auto'&&inheritedDark()));render()}const requested=new URLSearchParams(location.search).get('theme');if(['light','dark'].includes(requested))document.querySelector('#theme').value=requested;document.querySelector('#theme').addEventListener('change',setTheme);addEventListener('message',e=>{if(e.data?.type==='portfolio-theme'){websiteDark=e.data.theme==='dark';if(document.querySelector('#theme').value==='auto')setTheme()}});setTheme();</script></body></html>
